name: Refresh News Cache

on:
  workflow_dispatch: # Manual trigger only; scheduled refresh is paused

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/articles to refresh cache
        run: |
          curl -f -s "${{ secrets.SITE_URL }}/api/articles?force=1" \
            -H "Cache-Control: no-cache" \
            --max-time 60 \
            -o /dev/null \
            -w "HTTP status: %{http_code}\n"
